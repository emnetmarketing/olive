[build]
  publish = "."
  functions = "netlify/entries"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[functions."market-discovery-scheduled"]
  schedule = "0 */6 * * *"

[functions."keyword-candidate-scheduled"]
  schedule = "0 17 * * *"

[functions."trend-data-collection-scheduled"]
  schedule = "0 21 * * *"

[functions."trend-data-collection-recovery-scheduled"]
  schedule = "0 23 * * *"

[functions."trend-instant-dispatch-scheduled"]
  schedule = "*/2 * * * *"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
